services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/productivity-assistant
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CLIENT_ORIGIN: http://localhost:8080
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
    depends_on:
      - mongo
      - ai
    ports:
      - "4000:4000"

  ai:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
      SERVER_URL: http://server:4000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data:
